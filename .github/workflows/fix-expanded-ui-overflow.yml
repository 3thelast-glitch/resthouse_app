name: Fix expanded UI overflow

on:
  push:
    branches: [test/expand-ui-accessibility]
    paths:
      - '.github/workflows/fix-expanded-ui-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/expand-ui-accessibility
          fetch-depth: 0
      - name: Make booking rows wrap-safe at 200% text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/booking_manager_page.dart')
          lines = path.read_text().splitlines()

          def wrap_text_widget(marker: str, wrapper: str) -> None:
              marker_indexes = [i for i, line in enumerate(lines) if marker in line]
              if len(marker_indexes) != 1:
                  raise SystemExit(f'{marker}: expected exactly one marker, got {len(marker_indexes)}')
              marker_index = marker_indexes[0]

              start = marker_index
              while start >= 0 and lines[start].strip() != 'Text(':
                  start -= 1
              if start < 0:
                  raise SystemExit(f'{marker}: Text start not found')

              balance = 0
              end = start
              while end < len(lines):
                  balance += lines[end].count('(') - lines[end].count(')')
                  if end > start and balance == 0:
                      break
                  end += 1
              if balance != 0:
                  raise SystemExit(f'{marker}: Text end not found')

              indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
              block = lines[start:end + 1]
              wrapped = [f'{indent}{wrapper}(', f'{indent}  child: {block[0].lstrip()}']
              wrapped.extend(f'  {line}' for line in block[1:])
              wrapped.append(f'{indent}),')
              lines[start:end + 1] = wrapped

          payment_indexes = [i for i, line in enumerate(lines) if 'Icons.payments_outlined' in line]
          if len(payment_indexes) != 1:
              raise SystemExit(f'payments action: expected one icon, got {len(payment_indexes)}')
          row = payment_indexes[0]
          while row >= 0 and lines[row].strip() != 'Row(':
              row -= 1
          if row < 0:
              raise SystemExit('payments action: Row start not found')
          indent = lines[row][:len(lines[row]) - len(lines[row].lstrip())]
          expected = [
              'mainAxisAlignment: MainAxisAlignment.end,',
              'mainAxisSize: MainAxisSize.min,',
              'children: [',
          ]
          actual = [lines[row + offset].strip() for offset in (1, 2, 3)]
          if actual != expected:
              raise SystemExit(f'payments action: unexpected Row shape {actual}')
          lines[row:row + 4] = [
              f'{indent}Wrap(',
              f'{indent}  alignment: WrapAlignment.end,',
              f'{indent}  spacing: 12,',
              f'{indent}  runSpacing: 4,',
              f'{indent}  children: [',
          ]

          wrap_text_widget("'اسم المستأجر: '", 'Flexible')
          wrap_text_widget("booking['phone'].toString()", 'Expanded')
          wrap_text_widget("'${booking['total_price']} ر.س'", 'Expanded')
          wrap_text_widget("'${booking['security_deposit'] ?? 0.0} ر.س'", 'Expanded')

          path.write_text('\n'.join(lines) + '\n')
          PY
          dart format lib/pages/booking_manager_page.dart
      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-expanded-ui-overflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/booking_manager_page.dart .github/workflows/fix-expanded-ui-overflow.yml
          git commit -m 'fix(ui): prevent booking overflow at 200 percent text'
          git pull --rebase origin test/expand-ui-accessibility
          git push origin HEAD:test/expand-ui-accessibility
