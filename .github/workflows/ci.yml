name: Flutter CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: تثبيت الاعتمادات
        run: flutter pub get

      - name: التحليل الساكن
        run: flutter analyze

      - name: الاختبارات
        run: flutter test

      - name: إعداد Java لبناء Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فحص بناء Android Release دون توقيع
        env:
          ORG_GRADLE_PROJECT_resthouseUnsignedRelease: 'true'
          ORG_GRADLE_PROJECT_resthouseApplicationId: 'sa.norah.resthouse'
        run: flutter build apk --release
