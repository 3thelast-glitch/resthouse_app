name: Apply finance responsive fix

on:
  push:
    branches: [fix/responsive-rtl-overflow]
    paths:
      - '.github/workflows/apply-finance-responsive-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/responsive-rtl-overflow
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Apply and format
        run: |
          python tool/apply_finance_responsive_fix.py
          dart format lib/pages/finance_page.dart test/responsive_layout_test.dart

      - name: Commit changes and remove temporary tooling
        run: |
          rm -f tool/apply_finance_responsive_fix.py
          rm -f .github/workflows/apply-finance-responsive-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): make finance controls responsive'
          git push origin HEAD:fix/responsive-rtl-overflow
