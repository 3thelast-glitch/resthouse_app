name: Apply responsive overflow fix

on:
  push:
    branches: [fix/responsive-rtl-overflow]
    paths:
      - '.github/workflows/apply-responsive-overflow-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/responsive-rtl-overflow
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Apply source and test patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_responsive_overflow_fix.py
          python /tmp/apply_responsive_overflow_fix.py
          dart format lib/pages/ultimate_dashboard_page.dart lib/pages/booking_manager_page.dart test/responsive_layout_test.dart lib/utils/responsive.dart

      - name: Commit applied changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-responsive-overflow-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): make dashboard and bookings responsive'
          git push origin HEAD:fix/responsive-rtl-overflow
