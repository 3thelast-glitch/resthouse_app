name: Apply Arabic UI refresh

on:
  push:
    branches: [feat/arabic-ui-clarity]
    paths:
      - 'tool/apply_ui_consistency.py'
      - '.github/workflows/apply-ui-refresh.yml'
      - 'lib/main.dart'
      - 'lib/theme/**'
      - 'lib/utils/responsive.dart'
      - 'lib/pages/**'
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor IBM Plex Sans Arabic from the official IBM repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          base='https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-arabic/fonts/complete/ttf'
          curl --fail --location --retry 3 "$base/IBMPlexSansArabic-Regular.ttf" -o assets/fonts/IBMPlexSansArabic-Regular.ttf
          curl --fail --location --retry 3 "$base/IBMPlexSansArabic-Medium.ttf" -o assets/fonts/IBMPlexSansArabic-Medium.ttf
          curl --fail --location --retry 3 "$base/IBMPlexSansArabic-SemiBold.ttf" -o assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          curl --fail --location --retry 3 "$base/IBMPlexSansArabic-Bold.ttf" -o assets/fonts/IBMPlexSansArabic-Bold.ttf
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-arabic/LICENSE.txt' -o assets/fonts/IBM_PLEX_LICENSE.txt
          test "$(stat -c%s assets/fonts/IBMPlexSansArabic-Regular.ttf)" -gt 200000
          test "$(stat -c%s assets/fonts/IBMPlexSansArabic-Bold.ttf)" -gt 200000

      - name: Apply consistency migration
        run: |
          python3 tool/apply_ui_consistency.py
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('lib/pages').glob('*.dart'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('AppColors.background0', 'AppColors.secondaryText')
              text = text.replace('AppColors.primaryPressedGrey', 'AppColors.secondaryText')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply safe Dart const fixes
        run: dart fix --apply

      - name: Format changed UI sources
        run: |
          dart format \
            lib/main.dart \
            lib/theme/app_theme.dart \
            lib/utils/responsive.dart \
            lib/pages/main_shell.dart \
            lib/pages/booking_manager_page.dart \
            lib/pages/booking_payments_dialog.dart \
            lib/pages/finance_page.dart \
            lib/pages/settings_page.dart \
            lib/pages/ultimate_dashboard_page.dart

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android release build check
        env:
          ORG_GRADLE_PROJECT_resthouseUnsignedRelease: 'true'
          ORG_GRADLE_PROJECT_resthouseApplicationId: 'sa.norah.resthouse'
        run: flutter build apk --release

      - name: Commit verified UI refresh
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/apply_ui_consistency.py .github/workflows/apply-ui-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat(ui): improve Arabic typography colors and readability'
          git push origin HEAD:feat/arabic-ui-clarity
