name: Diagnose responsive tests txt

on:
  push:
    branches: [fix/responsive-rtl-overflow]
    paths:
      - '.github/workflows/diagnose-responsive-tests-txt.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/responsive-rtl-overflow
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture expanded test output
        shell: bash
        run: |
          set +e
          flutter test test/responsive_layout_test.dart --reporter expanded > responsive-test-output.txt 2>&1
          code=$?
          set -e
          echo >> responsive-test-output.txt
          echo "EXIT_CODE=$code" >> responsive-test-output.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/diagnose-responsive-tests-txt.yml
          mkdir -p docs/ui-review
          mv responsive-test-output.txt docs/ui-review/responsive-test-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/ui-review/responsive-test-output.txt
          git add -A
          git commit -m 'chore(test): capture responsive test output'
          git push origin HEAD:fix/responsive-rtl-overflow
