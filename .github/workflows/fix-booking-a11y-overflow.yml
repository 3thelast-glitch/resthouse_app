name: Fix booking accessibility overflow

on:
  push:
    branches: [feat/arabic-ui-clarity]
    paths:
      - '.github/workflows/fix-booking-a11y-overflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arabic-ui-clarity

      - name: Patch 200 percent text-scale overflows
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/pages/booking_manager_page.dart')
          text = path.read_text(encoding='utf-8')

          old = """    final hasDirectoryData = _bookings.isNotEmpty || _renters.isNotEmpty;\n\n    return Scaffold("""
          new = """    final hasDirectoryData = _bookings.isNotEmpty || _renters.isNotEmpty;\n    final textScale = MediaQuery.textScalerOf(context).scale(1.0);\n    final calendarRowHeight = (52.0 * textScale).clamp(52.0, 104.0).toDouble();\n    final calendarDowHeight = (28.0 * textScale).clamp(28.0, 56.0).toDouble();\n\n    return Scaffold("""
          if old not in text:
              raise SystemExit('Could not find build metrics insertion point')
          text = text.replace(old, new, 1)

          old = """                                headerVisible: false,\n                                calendarBuilders: CalendarBuilders("""
          new = """                                headerVisible: false,\n                                rowHeight: calendarRowHeight,\n                                daysOfWeekHeight: calendarDowHeight,\n                                calendarBuilders: CalendarBuilders("""
          if old not in text:
              raise SystemExit('Could not find TableCalendar insertion point')
          text = text.replace(old, new, 1)

          old = """                      Row(\n                        children: [\n                          const Icon(\n                            Icons.bookmark_added_outlined,\n                            color: AppColors.primary,\n                          ),\n                          const SizedBox(width: 8),\n                          Text(\n                            _selectedDay == null\n                                ? 'الحجوزات اليومية'\n                                : 'الحجوزات في تاريخ ${_selectedDay.toString().split(' ')[0]}',\n                            style: TextStyle(\n                              fontWeight: FontWeight.bold,\n                              fontSize: 15.sp(context),\n                              color: AppColors.heading,\n                            ),\n                          ),\n                        ],\n                      ),"""
          new = """                      Row(\n                        crossAxisAlignment: CrossAxisAlignment.start,\n                        children: [\n                          const Icon(\n                            Icons.bookmark_added_outlined,\n                            color: AppColors.primary,\n                          ),\n                          const SizedBox(width: 8),\n                          Expanded(\n                            child: Text(\n                              _selectedDay == null\n                                  ? 'الحجوزات اليومية'\n                                  : 'الحجوزات في تاريخ ${_selectedDay.toString().split(' ')[0]}',\n                              softWrap: true,\n                              style: TextStyle(\n                                fontWeight: FontWeight.bold,\n                                fontSize: 15.sp(context),\n                                color: AppColors.heading,\n                              ),\n                            ),\n                          ),\n                        ],\n                      ),"""
          if old not in text:
              raise SystemExit('Could not find daily bookings heading')
          text = text.replace(old, new, 1)

          old = """  Widget _buildDirectoryEmptyState() {\n    return Center(\n      child: Padding(\n        padding: const EdgeInsets.all(24),\n        child: Column(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            const Icon(\n              Icons.people_outline,\n              size: 44,\n              color: AppColors.primary,\n            ),\n            const SizedBox(height: 12),\n            Text(\n              'لا توجد حجوزات أو مستأجرون بعد',\n              textAlign: TextAlign.center,\n              style: TextStyle(\n                fontWeight: FontWeight.bold,\n                fontSize: 15.sp(context),\n                color: AppColors.heading,\n              ),\n            ),\n            const SizedBox(height: 8),\n            Text(\n              'استخدم أزرار الإضافة لإدخال بياناتك. ستظهر القوائم هنا بعد حفظ أول مستأجر أو حجز.',\n              textAlign: TextAlign.center,\n              style: TextStyle(\n                color: AppColors.secondaryText,\n                height: 1.45,\n                fontSize: 12.sp(context),\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }"""
          new = """  Widget _buildDirectoryEmptyState() {\n    return SingleChildScrollView(\n      padding: const EdgeInsets.all(24),\n      child: Center(\n        child: Column(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            const Icon(\n              Icons.people_outline,\n              size: 44,\n              color: AppColors.primary,\n            ),\n            const SizedBox(height: 12),\n            Text(\n              'لا توجد حجوزات أو مستأجرون بعد',\n              textAlign: TextAlign.center,\n              style: TextStyle(\n                fontWeight: FontWeight.bold,\n                fontSize: 15.sp(context),\n                color: AppColors.heading,\n              ),\n            ),\n            const SizedBox(height: 8),\n            Text(\n              'استخدم أزرار الإضافة لإدخال بياناتك. ستظهر القوائم هنا بعد حفظ أول مستأجر أو حجز.',\n              textAlign: TextAlign.center,\n              style: TextStyle(\n                color: AppColors.secondaryText,\n                height: 1.45,\n                fontSize: 12.sp(context),\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }"""
          if old not in text:
              raise SystemExit('Could not find directory empty state')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/booking_manager_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): prevent booking overflow at 200% text scale"
          git push origin HEAD:feat/arabic-ui-clarity
