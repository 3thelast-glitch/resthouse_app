name: Fix dashboard button content

on:
  push:
    branches: [feat/arabic-ui-clarity]
    paths:
      - 'tool/fix_dashboard_button_content.py'
      - '.github/workflows/fix-dashboard-button-content.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tool/fix_dashboard_button_content.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/pages/ultimate_dashboard_page.dart
      - run: flutter analyze
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/fix_dashboard_button_content.py .github/workflows/fix-dashboard-button-content.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): make dashboard button content wrap-safe'
          git pull --rebase origin feat/arabic-ui-clarity
          git push origin HEAD:feat/arabic-ui-clarity
