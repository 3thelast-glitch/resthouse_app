name: Responsive layout verification

on:
  push:
    branches: [fix/responsive-arabic-layout]
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/responsive-layout.yml'

permissions:
  contents: write

concurrency:
  group: responsive-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Apply remaining accessibility fixes
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path

          booking = Path('lib/pages/booking_manager_page.dart')
          source = booking.read_text(encoding='utf-8')
          old = 'rowHeight: 40 * scale + 24,'
          new = 'rowHeight: 56 * scale + 28,'
          if source.count(old) not in (0, 1):
              raise SystemExit(f'Unexpected calendar rowHeight count: {source.count(old)}')
          source = source.replace(old, new)
          source = source.replace('fontSize: 14,\n                height: 1.5,', 'fontSize: 14,\n                height: 1.25,')
          source = source.replace('fontSize: 12,\n                height: 1.5,', 'fontSize: 12,\n                height: 1.25,')
          booking.write_text(source, encoding='utf-8')

          payments = Path('lib/pages/booking_payments_dialog.dart')
          source = payments.read_text(encoding='utf-8')
          source = source.replace("import '../widgets/adaptive_content.dart';\n", '')
          old = """                              AmountText(\n                                payment['amount'] as num,\n                                style: Theme.of(context).textTheme.titleLarge,\n                              ),"""
          new = """                              _PaymentAmount(\n                                amount: payment['amount'] as num,\n                              ),"""
          if source.count(old) not in (0, 1):
              raise SystemExit(f'Unexpected payment AmountText count: {source.count(old)}')
          source = source.replace(old, new)
          anchor = 'class _SummaryAmount extends StatelessWidget {'
          helper = """class _PaymentAmount extends StatelessWidget {\n  const _PaymentAmount({required this.amount});\n\n  final num amount;\n\n  @override\n  Widget build(BuildContext context) {\n    final style = Theme.of(context).textTheme.titleLarge;\n    return Wrap(\n      spacing: 6,\n      runSpacing: 2,\n      crossAxisAlignment: WrapCrossAlignment.center,\n      children: [\n        Text(\n          amount.toStringAsFixed(2),\n          textDirection: TextDirection.ltr,\n          softWrap: false,\n          style: style,\n        ),\n        Text(\n          'ر.س',\n          style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n            color: style?.color,\n          ),\n        ),\n      ],\n    );\n  }\n}\n\n"""
          if '_PaymentAmount extends StatelessWidget' not in source:
              if anchor not in source:
                  raise SystemExit('Payment helper anchor missing')
              source = source.replace(anchor, helper + anchor)
          payments.write_text(source, encoding='utf-8')
      - name: Format and commit fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          dart format lib/pages/booking_manager_page.dart lib/pages/booking_payments_dialog.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/booking_manager_page.dart lib/pages/booking_payments_dialog.dart
          git commit -m "fix(ui): finish calendar and payment dialog accessibility fixes"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: flutter pub get
      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/widgets lib/pages/booking_manager_page.dart
          lib/pages/finance_page.dart lib/pages/main_shell.dart
          lib/pages/ultimate_dashboard_page.dart lib/pages/booking_payments_dialog.dart
          lib/pages/settings_page.dart lib/theme/app_theme.dart test/responsive_layout_test.dart
      - name: Analyze all code
        run: flutter analyze
      - name: Run complete test suite
        run: flutter test --reporter expanded
      - name: Capture responsive review frames
        env:
          CAPTURE_LAYOUT: '1'
        run: flutter test test/responsive_layout_test.dart --reporter expanded
      - name: Upload review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-frames
          path: build/layout-captures
          if-no-files-found: ignore
          retention-days: 14
