name: Responsive layout verification

on:
  push:
    branches: [fix/responsive-arabic-layout]
  pull_request:
    paths:
      - 'lib/**'
      - 'test/responsive_layout_test.dart'
      - '.github/workflows/responsive-layout.yml'

permissions:
  contents: write

concurrency:
  group: responsive-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format and commit responsive source
        if: github.event_name == 'push'
        shell: bash
        run: |
          dart format lib/widgets lib/pages/booking_manager_page.dart \
            lib/pages/finance_page.dart lib/pages/main_shell.dart \
            lib/pages/ultimate_dashboard_page.dart lib/pages/booking_payments_dialog.dart \
            lib/pages/settings_page.dart lib/theme/app_theme.dart test/responsive_layout_test.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets lib/pages/booking_manager_page.dart \
            lib/pages/finance_page.dart lib/pages/main_shell.dart \
            lib/pages/ultimate_dashboard_page.dart lib/pages/booking_payments_dialog.dart \
            lib/pages/settings_page.dart lib/theme/app_theme.dart test/responsive_layout_test.dart
          git commit -m "style: format responsive Flutter source"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: flutter pub get
      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/widgets lib/pages/booking_manager_page.dart
          lib/pages/finance_page.dart lib/pages/main_shell.dart
          lib/pages/ultimate_dashboard_page.dart lib/pages/booking_payments_dialog.dart
          lib/pages/settings_page.dart lib/theme/app_theme.dart test/responsive_layout_test.dart
      - name: Analyze production code
        run: flutter analyze lib
      - name: Analyze responsive test
        run: flutter analyze test/responsive_layout_test.dart
      - name: Test populated Arabic layouts and capture real Flutter frames
        env:
          CAPTURE_LAYOUT: '1'
        run: flutter test test/responsive_layout_test.dart --reporter expanded
      - name: Upload review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-frames
          path: build/layout-captures
          if-no-files-found: ignore
          retention-days: 14
