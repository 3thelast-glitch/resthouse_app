name: Diagnose expanded UI accessibility

on:
  push:
    branches: [test/expand-ui-accessibility]
    paths:
      - '.github/workflows/diagnose-expanded-ui.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run accessibility test with verbose output
        shell: bash
        run: timeout 120s flutter test test/ui_accessibility_test.dart -r expanded
