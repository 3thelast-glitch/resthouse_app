name: resthouse_app
description: نظام إدارة حجوزات الاستراحات
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.9.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  sqflite: ^2.3.0
  path: ^1.9.1
  table_calendar: ^3.2.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.3
  path_provider: ^2.1.3
  hijri: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  windows:
    generate: true
    image_path: "assets/icon/logo.png"
    icon_size: 256

